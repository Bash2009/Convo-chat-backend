services:
  db:
    image: postgres:16-alpine
    restart: always
    ports:
      - '5432:5432'
    environment:
      POSTGRES_PASSWORD: pass1234
    volumes:
      - ./data/db:/var/lib/postgresql/data

  test-db:
    image: postgres:16-alpine
    restart: always
    ports:
      - '5433:5432'
    environment:
      POSTGRES_PASSWORD: pass1234
      POSTGRES_DB: chat_test
    volumes:
      - ./data/test-db:/var/lib/postgresql/data
